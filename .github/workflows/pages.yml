name: Deploy games to GitHub Pages

on:
  push:
    # O repo ainda nao tem main/master; incluir as branches de trabalho faz o
    # deploy acontecer sozinho assim que o Pages for habilitado nas Settings.
    branches:
      - main
      - master
      - 'claude/dronefarer-roadmap-55s9sp'
      - 'claude/jogo-tiro-2d-top-down-va0z1w'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dronefarer/package-lock.json
            sinal-perdido/package-lock.json

      # DRONEFARER continua na raiz do site: a URL que ja foi compartilhada
      # nao pode mudar so porque entrou um segundo jogo no repo.
      - name: Build DRONEFARER
        working-directory: dronefarer
        # base absoluta com o nome do repo, exigida por project site do Pages
        run: |
          npm ci
          BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

      - name: Build SINAL PERDIDO
        working-directory: sinal-perdido
        run: |
          npm ci
          BASE_PATH="/${GITHUB_REPOSITORY#*/}/sinal-perdido/" npm run build

      - name: Juntar os dois em um site so
        run: |
          mkdir -p site
          cp -r dronefarer/dist/. site/
          mkdir -p site/sinal-perdido
          cp -r sinal-perdido/dist/. site/sinal-perdido/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
