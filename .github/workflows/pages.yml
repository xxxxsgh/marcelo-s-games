name: Deploy dos jogos no GitHub Pages

on:
  push:
    # O repo ainda nao tem main/master; incluir as branches de trabalho faz o
    # deploy acontecer sozinho assim que o Pages for habilitado nas Settings.
    branches: [main, master, 'claude/dronefarer-roadmap-55s9sp', 'claude/wizardly-euler-fj858t']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dronefarer/package-lock.json
            estrelas-que-riem/package-lock.json

      # DRONEFARER na raiz do site
      - name: Build DRONEFARER
        working-directory: dronefarer
        # base absoluta com o nome do repo, exigida por project site do Pages
        run: |
          npm ci
          BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

      # Estrelas que Riem em /estrelas-que-riem/ (base relativa, funciona em subpasta)
      - name: Build Estrelas que Riem
        working-directory: estrelas-que-riem
        run: |
          npm ci
          npm run build
          mkdir -p ../dronefarer/dist/estrelas-que-riem
          cp -r dist/. ../dronefarer/dist/estrelas-que-riem/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dronefarer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
