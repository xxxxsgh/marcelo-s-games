<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SINAL PERDIDO</title>
    <meta name="description" content="Shooter 2D de visao de cima: voce cai num planeta desconhecido e precisa reerguer a nave." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0710'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23ff7a3d' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%2379ffd0'/%3E%3Cpath d='M16 1v6M16 25v6M1 16h6M25 16h6' stroke='%23ff7a3d' stroke-width='2'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; overflow: hidden; background: #07060c; }
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #e6f2ff;
        -webkit-font-smoothing: antialiased;
        touch-action: none;
      }
      /* O palco tem altura PROPRIA, nao `position: fixed`.
         Dentro de um iframe que se dimensiona pelo conteudo, uma pagina toda
         fixed mede zero de altura e o host colapsa o quadro — tela preta. Com
         `100dvh` mais um piso em 16:9 sobre a largura, o jogo ocupa a janela
         quando ela existe e continua tendo tamanho quando ela nao existe. */
      #app {
        position: relative;
        width: 100%;
        height: 100dvh;
        min-height: min(56.25vw, 760px);
        background: #07060c;
        overflow: hidden;
      }
      canvas { display: block; width: 100%; height: 100%; cursor: none; }
      #boot {
        position: absolute; inset: 0; display: grid; place-content: center;
        gap: 14px; justify-items: center; background: #07060c; z-index: 100;
        transition: opacity .45s ease;
      }
      #boot h1 { font-size: 30px; letter-spacing: .46em; font-weight: 600; color: #ff7a3d; }
      #boot .sub { font-size: 11px; letter-spacing: .3em; color: #6b5f7a; }
      #boot .bar { width: 240px; height: 2px; background: #1b1526; overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 0%; background: #79ffd0; transition: width .2s; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot">
        <h1>SINAL PERDIDO</h1>
        <div class="sub">ENTRANDO NA ATMOSFERA</div>
        <div class="bar"><i id="boot-bar"></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
