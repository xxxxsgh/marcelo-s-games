<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5a0f25">
<title>Fortaleza Tricolor</title>
<style>
:root{--grena:#7a1733;--grena2:#4a0c1e;--verde:#0a6b3c;--verde2:#06472a;--ouro:#e8c261;--creme:#f4f1e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#173f1f;font-family:"Trebuchet MS",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:fixed;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.txt{text-shadow:0 2px 0 #0009,0 0 3px #000}
#top{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:max(8px,env(safe-area-inset-top)) 10px 0}
.col{display:flex;flex-direction:column;gap:6px}
.card{background:linear-gradient(180deg,#3a1522f0,#1d0a12f0);border:2px solid var(--ouro);border-radius:14px;box-shadow:0 3px 0 #0007,inset 0 1px 0 #fff3}
#club{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;cursor:pointer}
#club canvas{position:static;width:44px;height:50px;flex:none}
#cname{font-weight:900;font-size:15px;letter-spacing:.3px}
#xpw{width:120px;height:9px;background:#0008;border-radius:6px;overflow:hidden;margin-top:3px;border:1px solid #fff3}
#xpb{height:100%;background:linear-gradient(90deg,#3bd17a,#a8f0a0);width:0}
.sub{font-size:11px;opacity:.9;font-weight:700}
.row{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 10px;font-weight:900;font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.res{min-width:150px;padding:4px 10px 5px;font-weight:900;font-size:14px;position:relative;overflow:hidden}
.res .v{display:flex;justify-content:space-between;gap:10px;position:relative}
.res .bar{position:absolute;left:0;top:0;bottom:0;opacity:.55;transition:width .3s}
.res small{display:block;font-size:9px;opacity:.75;font-weight:700;position:relative;text-align:right}
#dock{bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:flex-end}
.btn{font:inherit;color:#fff;border:2px solid var(--ouro);border-radius:14px;background:linear-gradient(180deg,#9a2145,#5a0f25);box-shadow:0 4px 0 #2b0611,inset 0 1px 0 #fff5;font-weight:900;cursor:pointer;padding:8px 12px;text-shadow:0 2px 0 #0008;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2b0611}
.btn.g{background:linear-gradient(180deg,#19a35c,#06522f);box-shadow:0 4px 0 #032c19,inset 0 1px 0 #fff5}
.btn.k{background:linear-gradient(180deg,#5b5f6b,#2c2f38);box-shadow:0 4px 0 #14161b,inset 0 1px 0 #fff5}
.btn[disabled]{filter:grayscale(1) brightness(.7);cursor:not-allowed}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:74px;font-size:12px;padding:7px 8px}
.dbtn i{font-style:normal;font-size:24px;line-height:1.1}
.dbtn.big{min-width:96px;font-size:14px;padding:10px}
.dbtn.big i{font-size:32px}
#panel{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 86px);left:50%;transform:translateX(-50%);padding:10px 14px;display:none;min-width:270px;max-width:94vw;text-align:center}
#panel h3{margin:0 0 2px;font-size:16px}
#panel p{margin:2px 0 8px;font-size:12px;opacity:.9}
#panel .row{justify-content:center}
#modal{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:center;justify-content:center;padding:12px}
#mbox{width:min(760px,100%);max-height:92vh;overflow:auto;padding:14px 16px 16px;position:relative}
#mbox h2{margin:0 0 4px;font-size:22px}
#mbox .x{position:absolute;right:10px;top:10px;padding:4px 11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.it{background:linear-gradient(180deg,#f6efe0,#d9cdb2);color:#2a1218;border-radius:12px;border:2px solid #fff;padding:8px;text-align:center;box-shadow:0 3px 0 #0006;display:flex;flex-direction:column;gap:4px}
.it .ic{font-size:34px;line-height:1.1}
.it b{font-size:14px}
.it span{font-size:11px;line-height:1.25;flex:1}
.it .btn{font-size:13px;padding:6px}
.it.lock{filter:grayscale(.9);opacity:.75}
#toasts{top:42%;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30}
.toast{pointer-events:none;background:#000c;border:2px solid var(--ouro);border-radius:20px;padding:7px 16px;font-weight:800;font-size:14px;animation:tin 2.6s forwards}
@keyframes tin{0%{opacity:0;transform:translateY(12px)}10%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-12px)}}
#bhud{top:0;left:0;right:0;display:none;justify-content:space-between;align-items:flex-start;padding:max(8px,env(safe-area-inset-top)) 10px 0;gap:8px}
#bmid{padding:6px 16px;text-align:center;font-weight:900}
#btime{font-size:22px}
#bstars{font-size:20px;letter-spacing:3px}
#bbar{bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:none;gap:8px;align-items:flex-end;max-width:98vw}
.ucard{min-width:70px;padding:6px 8px;text-align:center;font-weight:900;font-size:12px;cursor:pointer;opacity:.85}
.ucard i{font-style:normal;font-size:26px;display:block}
.ucard.on{opacity:1;border-color:#fff;transform:translateY(-8px);box-shadow:0 0 0 3px #3bd17a,0 6px 0 #0007}
.ucard.zero{filter:grayscale(1);opacity:.5}
.stars{font-size:54px;letter-spacing:6px;text-align:center;margin:6px 0}
.center{text-align:center}
@media (max-width:640px){
 .res{min-width:112px;font-size:12px}.chip{font-size:11px;padding:3px 7px}
 #cname{font-size:13px}#xpw{width:84px}#club canvas{width:34px;height:39px}
 .dbtn{min-width:58px;font-size:10px;padding:6px 5px}.dbtn i{font-size:20px}
 .dbtn.big{min-width:74px;font-size:12px}.dbtn.big i{font-size:26px}
 #panel{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 74px)}
}
@media (max-height:480px){
 .dbtn{min-width:56px;font-size:10px;padding:4px 6px}.dbtn i{font-size:18px}
 .dbtn.big{min-width:70px;font-size:11px;padding:5px 6px}.dbtn.big i{font-size:22px}
 #panel{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 62px);padding:6px 10px}
 .res{min-width:120px;font-size:12px;padding:2px 8px 3px}#club canvas{width:30px;height:34px}.ucard{min-width:58px;font-size:10px;padding:3px 6px}.ucard i{font-size:20px}
 #btime{font-size:16px}#bstars{font-size:15px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="top" class="hud">
  <div class="col">
    <div id="club" class="card" title="Toque para renomear">
      <canvas id="crest" width="88" height="100"></canvas>
      <div><div id="cname" class="txt"></div><div class="sub">Nível <span id="lvl"></span></div><div id="xpw"><div id="xpb"></div></div></div>
    </div>
    <div class="row">
      <div class="card chip">🏆 <span id="trof"></span></div>
      <div class="card chip">👷 <span id="obras"></span></div>
      <div class="card chip">👥 <span id="elenco"></span></div>
    </div>
  </div>
  <div class="col">
    <div class="card res"><div class="bar" id="bm" style="background:#e0a91c"></div><div class="v txt"><span>🪙 Moedas</span><span id="rm"></span></div><small id="cm"></small></div>
    <div class="card res"><div class="bar" id="bg" style="background:#b02a58"></div><div class="v txt"><span>💪 Garra</span><span id="rg"></span></div><small id="cg"></small></div>
    <div class="card res"><div class="v txt"><span>⭐ Estrelas</span><span id="re"></span></div></div>
  </div>
</div>

<div id="panel" class="hud card"></div>

<div id="dock" class="hud">
  <button class="btn dbtn" onclick="openShop()"><i>🏗️</i>Construir</button>
  <button class="btn dbtn" onclick="openArmy()"><i>👥</i>Elenco</button>
  <button class="btn g dbtn big" onclick="goAttack()"><i>⚔️</i>Jogar Fora</button>
  <button class="btn dbtn" onclick="goDefend()"><i>🛡️</i>Defender</button>
  <button class="btn k dbtn" onclick="openCfg()"><i>⚙️</i>Opções</button>
</div>

<div id="bhud" class="hud">
  <div class="card chip" id="bleft"></div>
  <div class="card" id="bmid"><div id="btime" class="txt">3:00</div><div id="bstars">☆☆☆</div><div class="sub" id="bpct">0%</div></div>
  <div class="col" style="align-items:flex-end">
    <button class="btn k" id="bend" onclick="endBattleAsk()">Encerrar</button>
    <button class="btn" id="bnext" onclick="nextRival()">Próximo rival ▶</button>
  </div>
</div>
<div id="bbar" class="hud"></div>

<div id="toasts" class="hud"></div>
<div id="modal"><div id="mbox" class="card"></div></div>

<script>
'use strict';
/* =========================================================
   FORTALEZA TRICOLOR — jogo original de estratégia e construção
   Tudo em um único HTML: canvas 2D isométrico, sem dependências.
   ========================================================= */

// ---------- Configuração ----------
const G = 32;                 // tamanho do terreno (tiles)
const TW = 32, TH = 16;       // meio-tile em pixels
const M = 7;                  // anel de floresta em volta
const PAL_HOME = {a:'#7a1733', b:'#0a6b3c', w:'#f4f1e6'};
const EST_COST = [0,2500,12000,50000,180000], EST_TIME = [0,30,120,480,1200];
const CAP_EST = [3000,8000,25000,80000,250000], CAP_COFRE = [2000,6000,18000,50000,150000];
const DEF = {
  estadio:   {n:'Estádio', s:8, ic:'🏟️', hp:2400, res:'moedas', hgt:80, d:'O coração da fortaleza. Melhore para liberar construções e níveis.'},
  bilheteria:{n:'Bilheteria', s:3, ic:'🎟️', hp:400, res:'garra', base:150, t:8,  lim:[1,2,3,4,5], hgt:52, d:'Vende ingressos e gera Moedas.'},
  bateria:   {n:'Bateria da Torcida', s:3, ic:'🥁', hp:400, res:'moedas', base:150, t:8, lim:[1,2,3,4,5], hgt:48, d:'O batuque da arquibancada gera Garra.'},
  cofre:     {n:'Cofre', s:3, ic:'🏦', hp:600, res:'moedas', base:400, t:12, lim:[1,1,2,2,3], hgt:46, d:'Aumenta o limite de Moedas e Garra.'},
  ct:        {n:'Centro de Treino', s:3, ic:'⚽', hp:500, res:'garra', base:300, t:15, lim:[1,1,1,2,2], hgt:58, d:'Abriga o elenco e libera novos jogadores.'},
  torre:     {n:'Torre de Refletor', s:2, ic:'🗼', hp:520, res:'moedas', base:300, t:12, lim:[1,2,3,4,6], hgt:70, d:'Defesa rápida de longo alcance.'},
  lanca:     {n:'Lança-Bolas', s:2, ic:'💣', hp:600, res:'moedas', base:900, t:20, lim:[0,1,2,3,4], hgt:34, d:'Defesa lenta com dano em área.'},
  muro:      {n:'Muralha', s:1, ic:'🧱', hp:500, res:'moedas', base:40, t:0, lim:[10,25,45,65,90], hgt:22, d:'Segura os invasores. Melhoria instantânea.'},
  tocha:     {n:'Tocha', s:1, ic:'🔥', hp:1, res:'moedas', base:100, t:0, lim:[6,8,10,12,14], max:1, deco:1, hgt:40, d:'Decoração: ilumina a fortaleza.'},
  bandeira:  {n:'Bandeira', s:1, ic:'🚩', hp:1, res:'moedas', base:150, t:0, lim:[6,8,10,12,14], max:1, deco:1, hgt:54, d:'Decoração: as três cores ao vento.'},
  pedra:     {n:'Pedra', s:1, ic:'🪨', hp:1, deco:1, nat:1, hgt:22, d:'Pode ser removida para abrir espaço.'},
  arvore:    {n:'Árvore', s:1, ic:'🌳', hp:1, deco:1, nat:1, hgt:40, d:'Pode ser removida para abrir espaço.'}
};
const PROD = [1.2,2,3.2,5,7.5], PCAP = [500,1400,3500,8000,16000];   // por segundo / capacidade local
const CT_CAP = [20,30,40,50,60];
const UD = {
  atacante:  {n:'Atacante',   ic:'⚡', hp:90,  dmg:22, cd:1.0, sp:2.3, rg:.55, esp:1, custo:30,  ct:1, sc:1,    d:'Rápido e barato. Ataca o que estiver mais perto.'},
  meia:      {n:'Meia',       ic:'🎯', hp:55,  dmg:19, cd:1.0, sp:1.9, rg:3.6, esp:1, custo:50,  ct:2, sc:.95,  d:'Chuta de longe, por cima das muralhas.'},
  zagueiro:  {n:'Zagueiro',   ic:'🛡️', hp:720, dmg:32, cd:1.5, sp:1.3, rg:.6,  esp:5, custo:250, ct:3, sc:1.45, pref:1, d:'Tanque. Vai direto nas defesas.'},
  canhoneiro:{n:'Canhoneiro', ic:'💥', hp:210, dmg:120,cd:2.4, sp:1.5, rg:2.4, esp:4, custo:300, ct:4, sc:1.25, muro:4, d:'Chute bomba: destrói muralhas e construções.'}
};
const DEFS = {torre:{dmg:20, cd:.8, rg:6.5}, lanca:{dmg:38, cd:2.6, rg:5.5, spl:1.4}};
const RIV_A = ['Atlético','Unidos de','Real','Esporte Clube','Grêmio','Associação'];
const RIV_B = ['Serra Azul','Vale Dourado','Porto Bravo','Pedra Alta','Lagoa Funda','Vila Aurora','Mata Verde','Morro Alto','Ilha Clara'];
const RIV_C = [['#1c3f94','#f2c230'],['#111111','#d8d8d8'],['#c9441e','#222222'],['#2b7fb8','#ffffff'],['#5b2a86','#f0d000'],['#d6a400','#16324f']];

// ---------- Utilidades ----------
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const rnd = (a,b) => a + Math.random()*(b-a);
const ri = (a,b) => Math.floor(rnd(a,b+1));
const hash = i => { const s = Math.sin(i*127.1+311.7)*43758.5453; return s - Math.floor(s); };
const px = (x,y) => (x-y)*TW, py = (x,y) => (x+y)*TH;
const fmt = n => Math.floor(n).toLocaleString('pt-BR');
const sz = b => DEF[b.t].s;
function shade(h,p){ let r,g,b; if(h[0]==='#'){ const n=parseInt(h.slice(1),16); r=n>>16; g=n>>8&255; b=n&255; } else [r,g,b]=h.match(/\d+/g).map(Number); const f=p<0?0:255,a=Math.abs(p)/100;
  r=Math.round(r+(f-r)*a); g=Math.round(g+(f-g)*a); b=Math.round(b+(f-b)*a); return `rgb(${r},${g},${b})`; }
function tfmt(s){ s=Math.max(0,Math.ceil(s)); const m=Math.floor(s/60), h=Math.floor(m/60); return h?`${h}h ${m%60}m`:m?`${m}m ${s%60}s`:`${s}s`; }

// ---------- Estado / save ----------
const KEY = 'fortaleza-tricolor-v1';
let S, uid = 1;
function novoJogo(){
  S = {v:1, nome:'Fortaleza Tricolor', moedas:1200, garra:1200, estrelas:40, trofeus:0, xp:0, nivel:1, mute:false, defT:0,
       army:{atacante:8}, builds:[], last:Date.now()};
  const add = (t,x,y,lv=1) => S.builds.push({id:uid++, t, x, y, lv, up:0, dur:0, st:0});
  add('estadio',12,12); add('bilheteria',22,14); add('bateria',7,14); add('ct',14,22); add('torre',22,21); add('cofre',8,8);
  add('tocha',11,21); add('tocha',20,11); add('tocha',11,11); add('tocha',21,19); add('bandeira',13,21); add('bandeira',18,21);
  for(let i=0;i<10;i++) add('muro',9+i,25);
  let n=0, k=0; while(n<16 && k++<500){ const b={t:'arvore',x:ri(0,G-1),y:ri(0,G-1)}; if(livre(b,null,2)){ add(n%4===3?'pedra':'arvore',b.x,b.y); n++; } }
  S.novo=true;
}
function load(){
  try{ const j = JSON.parse(localStorage.getItem(KEY)); if(j && j.v===1 && j.builds){ S=j; uid = Math.max(0,...S.builds.map(b=>b.id))+1; } }catch(e){}
  if(!S) novoJogo();
  // produção offline
  const dt = clamp((Date.now()-S.last)/1000, 0, 8*3600); produzir(dt);
}
function save(){ S.last = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

// ---------- Regras da vila ----------
const est = () => S.builds.find(b=>b.t==='estadio');
const estLv = () => Math.max(1, est().lv);
const count = t => S.builds.filter(b=>b.t===t).length;
const maxLv = t => DEF[t].max || 5;
const ctLv = () => Math.max(1, ...S.builds.filter(b=>b.t==='ct').map(b=>b.lv));
const cap = () => CAP_EST[estLv()-1] + S.builds.filter(b=>b.t==='cofre'&&b.lv>0).reduce((s,b)=>s+CAP_COFRE[b.lv-1],0);
const armyCap = () => S.builds.filter(b=>b.t==='ct'&&b.lv>0).reduce((s,b)=>s+CT_CAP[b.lv-1],0);
const armyUsed = () => Object.keys(UD).reduce((s,k)=>s+(S.army[k]||0)*UD[k].esp,0);
const busy = () => S.builds.filter(b=>b.up).length;
const custo = (t,lv) => t==='estadio' ? EST_COST[lv-1] : Math.round(DEF[t].base*Math.pow(3.5,lv-1)/10)*10;
const tempo = (t,lv) => t==='estadio' ? EST_TIME[lv-1] : Math.round(DEF[t].t*Math.pow(3,lv-1));
const hpOf = (t,lv) => Math.round(DEF[t].hp*Math.pow(1.35,Math.max(1,lv)-1));
function livre(b, ign, margem=0){
  const s = sz(b); if(b.x<0||b.y<0||b.x+s>G||b.y+s>G) return false;
  for(const o of S.builds){ if(o===ign) continue; const t=sz(o);
    if(b.x < o.x+t+margem && o.x < b.x+s+margem && b.y < o.y+t+margem && o.y < b.y+s+margem) return false; }
  return true;
}
function ganhar(res, v){ const c = res==='estrelas'?1e9:cap(); const antes=S[res]; S[res]=Math.min(c, S[res]+v); return S[res]-antes; }
function pagar(res, v){ if(S[res]<v){ toast(`Falta ${res==='moedas'?'🪙 Moedas':res==='garra'?'💪 Garra':'⭐ Estrelas'}!`); sfx('no'); return false; } S[res]-=v; return true; }
function addXp(v){ S.xp+=v; let need=Math.round(30*Math.pow(S.nivel,1.5));
  while(S.xp>=need){ S.xp-=need; S.nivel++; S.estrelas+=5; toast(`⬆️ Nível ${S.nivel}! +5 ⭐`); sfx('win'); need=Math.round(30*Math.pow(S.nivel,1.5)); } }
function produzir(dt){
  for(const b of S.builds){ if(b.lv<1) continue;
    if(b.t==='bilheteria'||b.t==='bateria') b.st = Math.min(PCAP[b.lv-1], (b.st||0)+PROD[b.lv-1]*dt); }
}
function coletar(b){
  const res = b.t==='bilheteria'?'moedas':'garra', v=Math.floor(b.st||0); if(v<1) return;
  const g = ganhar(res, v); if(g<=0){ toast('Depósito cheio! Construa ou melhore um Cofre.'); return; }
  b.st -= g; floatTxt(b.x+1.5, b.y+1.5, `+${fmt(g)} ${res==='moedas'?'🪙':'💪'}`, res==='moedas'?'#ffd84a':'#ff8fb5'); sfx('coin');
}
function melhorar(b){
  const d=DEF[b.t], nv=b.lv+1;
  if(b.up) return; if(nv>maxLv(b.t)) return;
  if(b.t!=='estadio' && nv>estLv()){ toast(`Melhore o Estádio para o nível ${nv} primeiro.`); return; }
  const t=tempo(b.t,nv); if(t>0 && busy()>=2){ toast('Os 2 operários estão ocupados!'); return; }
  if(!pagar(d.res, custo(b.t,nv))) return;
  if(t>0){ b.up=Date.now()+t*1000; b.dur=t*1000; } else { b.lv=nv; addXp(2); }
  sfx('build'); save(); showPanel();
}
function acelerar(b){ const c=Math.max(1,Math.ceil((b.up-Date.now())/20000)); if(!pagar('estrelas',c)) return; b.up=Date.now(); }
function remover(b){
  if(DEF[b.t].nat){ if(!pagar('moedas',60)) return; const e=ri(1,2); S.estrelas+=e; floatTxt(b.x+.5,b.y+.5,`+${e} ⭐`,'#fff39a'); addXp(1); }
  else ganhar(DEF[b.t].res, Math.round(custo(b.t,1)/2));
  S.builds.splice(S.builds.indexOf(b),1); sel=null; showPanel(); sfx('build'); save();
}
function tickHome(dt){
  produzir(dt);
  const now=Date.now();
  for(const b of S.builds) if(b.up && now>=b.up){ b.up=0; b.lv++; addXp(4+b.lv*3+(b.t==='estadio'?20:0));

  if(!livre(ghost,null)) achaVaga(ghost); showPanel(); }
function achaVaga(g){ const s=sz(g), ox=g.x, oy=g.y; for(let r=1;r<G;r++) for(let dx=-r;dx<=r;dx++) for(let dy=-r;dy<=r;dy++){ if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
    g.x=ox+dx; g.y=oy+dy; if(g.x>=0&&g.y>=0&&g.x+s<=G&&g.y+s<=G&&livre(g,null)) return true; } g.x=ox; g.y=oy; return false; }
function confirmar(){
  const g=ghost, d=DEF[g.t]; if(!livre(g,null)){ toast('Não cabe aí!'); sfx('no'); return; }
  if(count(g.t)>=d.lim[estLv()-1]){ toast('Limite atingido. Melhore o Estádio!'); ghost=null; showPanel(); return; }
  const tp=tempo(g.t,1); if(tp>0&&busy()>=2){ toast('Os 2 operários estão ocupados!'); return; }
  if(!pagar(d.res,custo(g.t,1))) return;
  const b={id:uid++,t:g.t,x:g.x,y:g.y,lv:tp?0:1,up:tp?Date.now()+tp*1000:0,dur:tp*1000,st:0}; S.builds.push(b); sfx('build'); addXp(1);
  if(g.t==='muro'&&count('muro')<d.lim[estLv()-1]){ ghost={...g}; for(const [dx,dy] of [[1,0],[0,1],[-1,0],[0,-1]]){ ghost.x=g.x+dx; ghost.y=g.y+dy; if(livre(ghost,null)) break; } if(!livre(ghost,null)) achaVaga(ghost); }
  else { ghost=null; sel=b; }
  showPanel(); save();
}
function openArmy(){
  const lv=ctLv(), used=armyUsed(), cp=armyCap();
  let h=`<h2>👥 Elenco</h2><div class="sub">Vagas ${used}/${cp} · Centro de Treino nível ${lv} · 💪 ${fmt(S.garra)}</div><div class="grid">`;
  for(const k in UD){ const d=UD[k], ok=d.ct<=lv, m=Math.pow(1.15,lv-1);
    h+=`<div class="it ${ok?'':'lock'}"><div class="ic">${d.ic}</div><b>${d.n} <small>x${S.army[k]||0}</small></b><span>${d.d}</span><span>❤ ${Math.round(d.hp*m)} · ⚔ ${Math.round(d.dmg*m)} · ocupa ${d.esp}</span>
      ${ok?`<div class="row" style="justify-content:center"><button class="btn g" onclick="treinar('${k}',1)">+1 · 💪${d.custo}</button><button class="btn g" onclick="treinar('${k}',5)">+5</button></div>`:`<button class="btn k" disabled>CT nível ${d.ct}</button>`}</div>`; }
  modal(h+'</div>');
}
function treinar(k,n){ const d=UD[k]; let f=0; for(let i=0;i<n;i++){ if(armyUsed()+d.esp>armyCap()){ if(!f) toast('Elenco cheio! Melhore o Centro de Treino.'); break; } if(S.garra<d.custo){ if(!f) pagar('garra',d.custo); break; } S.garra-=d.custo; S.army[k]=(S.army[k]||0)+1; f++; }
  if(f){ sfx('coin'); save(); } openArmy(); updHud(); }
function openCfg(){ modal(`<h2>⚙️ Opções</h2>
  <p class="sub">Arraste para mover a câmera · roda do mouse ou pinça para zoom · toque numa construção para selecionar e arraste para mudar de lugar.</p>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="S.mute=!S.mute;save();openCfg()">${S.mute?'🔇 Som desligado':'🔊 Som ligado'}</button>
  <button class="btn" onclick="renomear()">✏️ Renomear clube</button>
  <button class="btn k" onclick="if(confirm('Apagar todo o progresso e recomeçar?')){localStorage.removeItem(KEY);location.reload()}">🗑️ Recomeçar</button></div>`); }
function renomear(){ const n=prompt('Nome da sua fortaleza:',S.nome); if(n&&n.trim()){ S.nome=n.trim().slice(0,20); save(); updHud(); } }
$('club').onclick=renomear;

// ---------- Loop ----------
let lastT=performance.now(), hudT=0, saveT=0;
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  if(bt) tickBattle(dt); else tickHome(dt);
  render(dt);
  if((hudT+=dt)>.25){ hudT=0; updHud(); }
  if((saveT+=dt)>5){ saveT=0; if(!bt) save(); }
  requestAnimationFrame(frame);
}
function init(){
  resize(); load(); makeGround();
  cam.z=clamp(Math.min(W/1150,H/640),.5,1.3);
  const k=$('crest'); c=k.getContext('2d'); crest(44,48,34,PAL_HOME); c=main;
  updHud(); requestAnimationFrame(frame);
  if(S.novo){ delete S.novo; modal(`<h2 class="center">Bem-vindo à Fortaleza Tricolor!</h2>
    <p class="center" style="font-size:15px;line-height:1.5">Construa sua base em volta do estádio, fortaleça as defesas<br>e leve as três cores para vencer fora de casa!</p>
    <p class="center sub">🪙 Bilheterias geram Moedas · 💪 a Bateria gera Garra · 👥 treine o Elenco · ⚔️ jogue fora para ganhar prêmios e 🏆</p>
    <div class="center"><button class="btn g" style="font-size:18px;padding:10px 26px" onclick="closeModal()">Vamos nessa!</button></div>`); }
  addEventListener('visibilitychange',()=>{ if(document.hidden&&!bt) save(); });
}
init();
</script>
