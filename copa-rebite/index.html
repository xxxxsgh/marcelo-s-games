<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copa Rebite — torneio de combate de robôs</title>
<style>:root{--am:#f2b21c;--bg:#0b0e13;--bg2:#141a22;--tx:#eef1f4;--mu:#8d98a6;--r:#d8402f;--b:#2f7de0}
html,body{margin:0;height:100%;background:#050608;overflow:hidden;font-family:"Bahnschrift","DIN Condensed","Arial Narrow","Liberation Sans Narrow",Arial,sans-serif;color:var(--tx);font-size:1.85vh;letter-spacing:.04em;user-select:none}
#cv,#cv2{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none;text-transform:uppercase}
.scr{position:absolute;inset:0;display:none}
.on{display:block}
b,.h{font-weight:800}
/* HUD */
.card{position:absolute;top:2.2vh;width:31vw;background:linear-gradient(180deg,rgba(10,13,18,.92),rgba(10,13,18,.72));padding:1vh 1.4vh 1.1vh;clip-path:polygon(0 0,100% 0,96% 100%,0 100%)}
.card.l{left:2vw;border-left:.6vh solid var(--cc)}
.card.r{right:2vw;clip-path:polygon(0 0,100% 0,100% 100%,4% 100%);border-right:.6vh solid var(--cc);text-align:right}
.card .nm{font-size:2.9vh;font-weight:800;white-space:nowrap;overflow:hidden;line-height:1.1}
.card .nu{display:inline-block;background:var(--cc);color:#fff;padding:0 .9vh;margin:0 .8vh 0 0;font-weight:800;text-shadow:0 0 .3vh #000}
.card.r .nu{margin:0 .8vh 0 .8vh}
.card .sb{color:var(--mu);font-size:1.5vh;margin:.1vh 0 .5vh}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:.7vh}
.bar{font-size:1.25vh;color:var(--mu)}
.bar i{display:block;height:.9vh;background:#232b36;margin-top:.25vh;position:relative;overflow:hidden}
.bar i u{position:absolute;inset:0;background:var(--am);transform-origin:left;transition:transform .15s}
.card.r .bar i u{transform-origin:right}
.bar.low i u{background:var(--r)}
.bar.dead{color:var(--r);text-decoration:line-through}
.wst{margin-top:.6vh;font-size:1.5vh;display:flex;gap:.8vh;align-items:center}
.card.r .wst{flex-direction:row-reverse}
.wst span{color:var(--am);font-weight:800;min-width:16vh}
.wst i{flex:1;height:.6vh;background:#232b36;position:relative}
.wst i u{position:absolute;inset:0;background:#fff;transform-origin:left}
#clock{position:absolute;top:2.2vh;left:50%;transform:translateX(-50%);text-align:center;background:var(--am);color:#0b0e13;padding:.5vh 3.2vh .3vh;clip-path:polygon(0 0,100% 0,90% 100%,10% 100%);min-width:15vh}
#clock b{display:block;font-size:4.6vh;line-height:1;font-variant-numeric:tabular-nums}
#clock span{font-size:1.4vh;font-weight:700}
#msg{position:absolute;left:0;right:0;top:27vh;text-align:center;font-size:11vh;font-weight:800;text-shadow:0 .5vh 0 #000,0 0 4vh rgba(0,0,0,.8);letter-spacing:.08em}
#sub{position:absolute;left:0;right:0;top:17vh;text-align:center;font-size:3.2vh;color:var(--am);text-shadow:0 .2vh 0 #000;font-weight:700}
#ko{position:absolute;left:50%;transform:translateX(-50%);bottom:14vh;background:var(--r);color:#fff;padding:.6vh 3vh;font-size:3.4vh;font-weight:800;display:none;clip-path:polygon(4% 0,100% 0,96% 100%,0 100%)}
#cam{position:absolute;left:2vw;bottom:3vh;font-size:1.5vh;color:var(--mu);background:rgba(10,13,18,.7);padding:.4vh 1vh}
#cam b{color:var(--tx)}
#hint{position:absolute;right:2vw;bottom:3vh;font-size:1.4vh;color:var(--mu);background:rgba(10,13,18,.7);padding:.4vh 1vh;text-align:right}
#rep{position:absolute;left:2vw;top:14vh;background:var(--r);color:#fff;font-weight:800;padding:.4vh 1.6vh;font-size:2.4vh;display:none}
/* garagem */
#gar .pn{position:absolute;left:3vw;top:5vh;width:34vw;background:linear-gradient(180deg,rgba(10,13,18,.94),rgba(10,13,18,.82));padding:2vh 2.2vh;border-top:.6vh solid var(--am)}
#gar h1{margin:0 0 .2vh;font-size:4.2vh;line-height:1}
#gar h1 em{color:var(--am);font-style:normal}
#gar .st{color:var(--mu);font-size:1.6vh;margin-bottom:1.4vh}
.row{display:flex;align-items:center;padding:.75vh 1vh;margin:.35vh 0;background:#161c25;border-left:.5vh solid transparent;font-size:2vh}
.row .k{width:11vh;color:var(--mu);font-size:1.5vh}
.row .v{flex:1;font-weight:700;white-space:nowrap;overflow:hidden}
.row .x{color:var(--mu);font-size:1.4vh;margin-left:1vh}
.row.sel{border-left-color:var(--am);background:#222b38}
.row.ed{background:var(--am);color:#0b0e13}.row.ed .k,.row.ed .x{color:#3a2c05}
.row.go{justify-content:center;font-weight:800;font-size:2.4vh;background:#1d2a1c;margin-top:1.2vh}
.row.go.sel{background:#2f8f3c}.row.go.no{background:#40201c;color:#e7a39b}
.row input{font:inherit;color:inherit;background:transparent;border:0;border-bottom:.2vh solid var(--mu);width:22vh;text-transform:uppercase;pointer-events:auto;outline:0}
.row .sw{display:inline-block;width:2.2vh;height:2.2vh;margin-right:.5vh;vertical-align:middle;border:.2vh solid transparent}
.row .sw.c{border-color:#fff}
.hp{display:inline-block;width:8vh;height:.8vh;background:#232b36;position:relative;margin-left:1vh}
.hp u{position:absolute;inset:0;background:var(--am);transform-origin:left}
#gar .ds{color:var(--mu);font-size:1.55vh;min-height:4.2vh;margin-top:1vh;text-transform:none;letter-spacing:.01em}
#gar .sp{position:absolute;right:3vw;top:5vh;width:27vw;background:linear-gradient(180deg,rgba(10,13,18,.94),rgba(10,13,18,.82));padding:2vh 2.2vh;border-top:.6vh solid var(--am)}
.sbar{margin:1vh 0}
.sbar div{display:flex;justify-content:space-between;font-size:1.6vh}
.sbar div b{font-variant-numeric:tabular-nums}
.sbar i{display:block;height:1.3vh;background:#232b36;position:relative;margin-top:.3vh}
.sbar i u{position:absolute;inset:0;background:var(--am);transform-origin:left;transition:transform .25s}
.sbar i s{position:absolute;top:-.4vh;bottom:-.4vh;width:.3vh;background:#fff}
.sbar.over i u{background:var(--r)}.sbar.over b{color:var(--r)}
.sbar .dl{font-size:1.3vh;color:#6fcf7f;margin-left:.6vh}.sbar .dl.n{color:#ff8a7a}

/* chave */
#chave{background:linear-gradient(180deg,rgba(6,8,11,.82),rgba(6,8,11,.93))}
#chave h1{text-align:center;font-size:5vh;margin:4vh 0 0}
#chave h1 em{color:var(--am);font-style:normal}
#chave .s{text-align:center;color:var(--mu);margin-bottom:2vh}
.bk{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3vw;padding:0 6vw;align-items:center}
.col{display:flex;flex-direction:column;justify-content:space-around;gap:2.4vh}
.col h2{font-size:1.8vh;color:var(--am);margin:0 0 -1vh;font-weight:700}
.mt{background:#141a22;border-left:.5vh solid #2b3442}
.mt.nx{border-left-color:var(--am);box-shadow:0 0 0 .2vh var(--am)}
.mt div{display:flex;padding:.7vh 1.2vh;font-size:2.1vh;font-weight:700;align-items:center}

.mt span{margin-left:auto;font-size:1.4vh;color:var(--mu);font-weight:400}

#chave .big{text-align:center;font-size:3vh;font-weight:800;color:var(--am);margin-top:2.5vh}
/* apresentacao */
#intro .ic{position:absolute;bottom:9vh;width:40vw;background:linear-gradient(180deg,rgba(10,13,18,.95),rgba(10,13,18,.8));padding:1.6vh 2.4vh;border-top:.6vh solid var(--cc)}
#intro .ic.l{left:5vw}#intro .ic.r{right:5vw;text-align:right}
#intro .ic .n{font-size:6.4vh;font-weight:800;line-height:1}
#intro .ic .t{color:var(--am);font-size:1.8vh}
#intro .ic table{width:100%;font-size:1.9vh;margin-top:.8vh;border-collapse:collapse}
#intro .ic td{padding:.25vh 0}#intro .ic td:first-child{color:var(--mu);width:34%}
#intro .ic.r td:first-child{text-align:left}
/* juizes */
#juizes{background:rgba(6,8,11,.6)}
#juizes h1{text-align:center;font-size:5vh;margin:9vh 0 3vh}
.jg{display:flex;justify-content:center;gap:2.5vw}
.jc{width:24vw;background:#141a22;border-top:.6vh solid var(--am);padding:1.4vh 1.8vh}
.jc h3{margin:0 0 1vh;font-size:2vh;color:var(--am)}
.jc table{width:100%;border-collapse:collapse;font-size:1.9vh}
.jc td{padding:.4vh 0;text-align:center}.jc td:first-child{text-align:left;color:var(--mu)}
.jc tr.t td{border-top:.2vh solid #2b3442;font-weight:800;font-size:2.6vh}
#juizes .vd{text-align:center;font-size:4.4vh;font-weight:800;margin-top:4vh}
#juizes .vd em{color:var(--am);font-style:normal}
#toast{position:absolute;left:50%;top:13vh;transform:translateX(-50%);background:#141a22;border-left:.5vh solid var(--am);padding:.6vh 1.6vh;font-size:1.7vh;display:none}
#pausa{background:rgba(6,8,11,.75)}
#pausa div{position:absolute;left:0;right:0;top:36vh;text-align:center;font-size:8vh;font-weight:800}
#pausa p{position:absolute;left:0;right:0;top:50vh;text-align:center;color:var(--mu);font-size:1.8vh;line-height:1.9}
#erro{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;font-size:2.4vh;padding:10vw;text-transform:none;background:#0b0e13}
#carga{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#0b0e13;font-size:2vh;color:var(--mu)}
#carga b{font-size:6vh;color:var(--tx)}#carga b em{color:var(--am);font-style:normal}

.cq{display:grid;grid-template-columns:1fr 1fr;gap:.5vh;margin:.6vh 0}.cq div{background:#161c25;padding:.7vh 1vh;color:var(--mu);font-size:1.5vh;text-transform:none}.cq div b{display:block;color:#5d6876;font-size:1.7vh;text-transform:uppercase}.cq div.ok b{color:var(--am)}.cq div.ok{color:var(--tx)}

<body>
<canvas id="cv"></canvas>
<div id="ui"></div>
<div id="carga"><b>COPA <em>REBITE</em></b><span>montando a arena…</span></div>
<script>
'use strict';
// ==== 00_math.js ====
// ---------- matematica sem alocacao: tudo escreve em arrays ja existentes ----------
const PI = Math.PI, TAU = PI * 2;
const hyp = (a, b, c = 0, d = 0) => Math.sqrt(a * a + b * b + c * c + d * d);
// Registradores pre-alocados. Convencao do codigo quente (luta): nenhuma funcao recebe ou devolve double;
// os valores vao por estes arrays, porque o V8 encaixota doubles (HeapNumber) em chamadas nao embutidas.
// _c simulacao (0-14 saidas, 32-63 entradas), _f efeitos, _d instancia, _t translacao+angulo, _q pose, _k camera/vibracao, _u aleatorio
const _c = new Float64Array(64), _f = new Float32Array(16), _d = new Float32Array(12), _t = new Float64Array(4), _q = new Float64Array(8), _k = new Float32Array(12), _u = new Float64Array(1);
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const sign = x => x < 0 ? -1 : 1;
const wrapPi = a => { a = (a + PI) % TAU; if (a < 0) a += TAU; return a - PI; };

class Rng {
  constructor(seed) { this.s = new Uint32Array(1); this.s[0] = seed >>> 0; }
  seed(v) { this.s[0] = v >>> 0; }
  u() { // mulberry32
    const s = this.s; s[0] += 0x6D2B79F5; let t = s[0];
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  uR() { const s = this.s; s[0] += 0x6D2B79F5; let t = s[0]; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); _u[0] = ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  r(a, b) { return a + (b - a) * this.u(); }
  s1() { return this.u() * 2 - 1; }
}

const M4 = {
  ident(o, i) { o.fill(0, i, i + 16); o[i] = o[i + 5] = o[i + 10] = o[i + 15] = 1; },
  copy(o, i, a, j) { for (let k = 0; k < 16; k++) o[i + k] = a[j + k]; },
  // o = a*b (coluna-maior). o nao pode ser a nem b
  mul(o, i, a, j, b, k) {
    for (let c = 0; c < 4; c++) {
      const b0 = b[k + c * 4], b1 = b[k + c * 4 + 1], b2 = b[k + c * 4 + 2], b3 = b[k + c * 4 + 3];
      o[i + c * 4] = a[j] * b0 + a[j + 4] * b1 + a[j + 8] * b2 + a[j + 12] * b3;
      o[i + c * 4 + 1] = a[j + 1] * b0 + a[j + 5] * b1 + a[j + 9] * b2 + a[j + 13] * b3;
      o[i + c * 4 + 2] = a[j + 2] * b0 + a[j + 6] * b1 + a[j + 10] * b2 + a[j + 14] * b3;
      o[i + c * 4 + 3] = a[j + 3] * b0 + a[j + 7] * b1 + a[j + 11] * b2 + a[j + 15] * b3;
    }
  },
  persp(o, fovy, asp, n, f) { // profundidade 0..1
    const t = 1 / Math.tan(fovy / 2); o.fill(0, 0, 16);
    o[0] = t / asp; o[5] = t; o[10] = f / (n - f); o[11] = -1; o[14] = n * f / (n - f);
  },
  ortho(o, l, r, b, t, n, f) {
    o.fill(0, 0, 16); o[0] = 2 / (r - l); o[5] = 2 / (t - b); o[10] = 1 / (n - f);
    o[12] = (l + r) / (l - r); o[13] = (t + b) / (b - t); o[14] = n / (n - f); o[15] = 1;
  },
  lookAt(o, ex, ey, ez, tx, ty, tz, ux, uy, uz) {
    let zx = ex - tx, zy = ey - ty, zz = ez - tz; let l = 1 / hyp(zx, zy, zz); zx *= l; zy *= l; zz *= l;
    let xx = uy * zz - uz * zy, xy = uz * zx - ux * zz, xz = ux * zy - uy * zx; l = 1 / (hyp(xx, xy, xz) || 1); xx *= l; xy *= l; xz *= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    o[0] = xx; o[1] = yx; o[2] = zx; o[3] = 0; o[4] = xy; o[5] = yy; o[6] = zy; o[7] = 0; o[8] = xz; o[9] = yz; o[10] = zz; o[11] = 0;
    o[12] = -(xx * ex + xy * ey + xz * ez); o[13] = -(yx * ex + yy * ey + yz * ez); o[14] = -(zx * ex + zy * ey + zz * ez); o[15] = 1;
  },
  invert(o, a) {
    const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3], a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7], a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11], a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
    const b00 = a00 * a11 - a01 * a10, b01 = a00 * a12 - a02 * a10, b02 = a00 * a13 - a03 * a10, b03 = a01 * a12 - a02 * a11, b04 = a01 * a13 - a03 * a11, b05 = a02 * a13 - a03 * a12, b06 = a20 * a31 - a21 * a30, b07 = a20 * a32 - a22 * a30, b08 = a20 * a33 - a23 * a30, b09 = a21 * a32 - a22 * a31, b10 = a21 * a33 - a23 * a31, b11 = a22 * a33 - a23 * a32;
    let d = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06; d = 1 / d;
    o[0] = (a11 * b11 - a12 * b10 + a13 * b09) * d; o[1] = (a02 * b10 - a01 * b11 - a03 * b09) * d; o[2] = (a31 * b05 - a32 * b04 + a33 * b03) * d; o[3] = (a22 * b04 - a21 * b05 - a23 * b03) * d;
    o[4] = (a12 * b08 - a10 * b11 - a13 * b07) * d; o[5] = (a00 * b11 - a02 * b08 + a03 * b07) * d; o[6] = (a32 * b02 - a30 * b05 - a33 * b01) * d; o[7] = (a20 * b05 - a22 * b02 + a23 * b01) * d;
    o[8] = (a10 * b10 - a11 * b08 + a13 * b06) * d; o[9] = (a01 * b08 - a00 * b10 - a03 * b06) * d; o[10] = (a30 * b04 - a31 * b02 + a33 * b00) * d; o[11] = (a21 * b02 - a20 * b04 - a23 * b00) * d;
    o[12] = (a11 * b07 - a10 * b09 - a12 * b06) * d; o[13] = (a00 * b09 - a01 * b07 + a02 * b06) * d; o[14] = (a31 * b01 - a30 * b03 - a32 * b00) * d; o[15] = (a20 * b03 - a21 * b01 + a22 * b00) * d;
  },
  // matriz a partir de quaternio + posicao (escala 1)
  fromQTr(o, i) {
    const x = _q[0], y = _q[1], z = _q[2], w = _q[3], px = _q[4], py = _q[5], pz = _q[6];
    const x2 = x + x, y2 = y + y, z2 = z + z, xx = x * x2, xy = x * y2, xz = x * z2, yy = y * y2, yz = y * z2, zz = z * z2, wx = w * x2, wy = w * y2, wz = w * z2;
    o[i] = 1 - yy - zz; o[i + 1] = xy + wz; o[i + 2] = xz - wy; o[i + 3] = 0;
    o[i + 4] = xy - wz; o[i + 5] = 1 - xx - zz; o[i + 6] = yz + wx; o[i + 7] = 0;
    o[i + 8] = xz + wy; o[i + 9] = yz - wx; o[i + 10] = 1 - xx - yy; o[i + 11] = 0;
    o[i + 12] = px; o[i + 13] = py; o[i + 14] = pz; o[i + 15] = 1;
  },
  // o = a * T(tx,ty,tz) * R(eixo 0|1|2, ang)
  mulTRr(o, i, a, j, axis) {
    const tx = _t[0], ty = _t[1], tz = _t[2], ang = _t[3], c = Math.cos(ang), s = Math.sin(ang), t = M4._t; t.fill(0); t[0] = t[5] = t[10] = t[15] = 1;
    if (axis === 0) { t[5] = c; t[6] = s; t[9] = -s; t[10] = c; } else if (axis === 1) { t[0] = c; t[2] = -s; t[8] = s; t[10] = c; } else { t[0] = c; t[1] = s; t[4] = -s; t[5] = c; }
    t[12] = tx; t[13] = ty; t[14] = tz; M4.mul(o, i, a, j, t, 0);
  },
  _t: new Float32Array(16),
};

// ==== 10_mesh.js ====
// ---------- construtor de malhas procedurais (so roda na carga) ----------
// vertice: pos(3) normal(3) cor rgb + material (4 x u8) aux(1 float) = 32 bytes
const MAT = { PAINT: 0, PAINT2: 1, STEEL: 2, ALU: 3, TITAN: 4, RUBBER: 5, DARK: 6, WIRE: 7, BATT: 8, EMIS: 9, FLOOR: 10, CONC: 11, CLOTH: 12, TRUSS: 13, HAZ: 14, SEAT: 15, SCREEN: 16, BRASS: 17, LENS: 18, WOOD: 19, PEG: 20, ARMOR: 21, SKIN: 22, BANNER: 23, SPIN: 24 };

class MB {

diagnostic(off, derivative_uniformity);

struct Frame { vpJ: mat4x4f, vp: mat4x4f, pvp: mat4x4f, ivpJ: mat4x4f, view: mat4x4f, cam: vec4f, res: vec4f, misc: vec4f, misc2: vec4f, jit: vec4f,
  lights: array<Light,16>, svp: array<mat4x4f,4>, pp: vec4f, fx: vec4f }
const PI = 3.14159265;
fn h31(p: vec3f) -> f32 { var q = fract(p * vec3f(.1031, .1030, .0973)); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
fn h21(p: vec2f) -> f32 { var q = fract(vec3f(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
fn h22(p: vec2f) -> vec2f { var q = fract(vec3f(p.xyx) * vec3f(.1031, .1030, .0973)); q += dot(q, q.yzx + 33.33); return fract((q.xx + q.yz) * q.zy); }
fn vn(p: vec3f) -> f32 { let i = floor(p); let f = fract(p); let u = f * f * (3. - 2. * f);
  return mix(mix(mix(h31(i), h31(i + vec3f(1, 0, 0)), u.x), mix(h31(i + vec3f(0, 1, 0)), h31(i + vec3f(1, 1, 0)), u.x), u.y),
             mix(mix(h31(i + vec3f(0, 0, 1)), h31(i + vec3f(1, 0, 1)), u.x), mix(h31(i + vec3f(0, 1, 1)), h31(i + vec3f(1, 1, 1)), u.x), u.y), u.z); }
fn vn2(p: vec2f) -> f32 { let i = floor(p); let f = fract(p); let u = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2f(1, 0)), u.x), mix(h21(i + vec2f(0, 1)), h21(i + vec2f(1, 1)), u.x), u.y); }
fn fbm(p: vec3f) -> f32 { return vn(p) * .5 + vn(p * 2.03 + 7.1) * .25 + vn(p * 4.1 + 13.7) * .125 + vn(p * 8.3 + 3.3) * .0625; }
fn fbm2(p: vec2f) -> f32 { return vn2(p) * .5 + vn2(p * 2.03 + 7.1) * .25 + vn2(p * 4.1 + 13.7) * .125 + vn2(p * 8.3 + 3.3) * .0625; }
fn ign(p: vec2f, fr: f32) -> f32 { let q = p + 5.588238 * (fr % 64.); return fract(52.9829189 * fract(.06711056 * q.x + .00583715 * q.y)); }
// riscos finos: uma linha aleatoria por celula
fn scratch(uv: vec2f, sd: f32) -> f32 {
  var m = 0.;
  for (var k = 0; k < 2; k++) {
    let p = uv * (1. + f32(k) * .73) + f32(k) * 17.3 + sd; let c = floor(p); let f = fract(p) - .5; let r = h22(c);
    let a = r.x * 6.283; let d = vec2f(cos(a), sin(a)); let dist = abs(dot(f - (r - .5) * .5, vec2f(-d.y, d.x)));

    m = max(m, (1. - smoothstep(0., w, dist)) * step(.35, r.y) * min(1., .012 / w));
